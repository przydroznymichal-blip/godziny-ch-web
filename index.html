<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Godziny CH">
<meta name="theme-color" content="#D52B1E">
<title>Godziny CH</title>
<!--MANIFEST--><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="ikona-180.png"><link rel="icon" href="ikona-192.png"><!--/MANIFEST-->
<style>
:root { --czer: #C62828; --ziel: #2E7D32; --nieb: #1565C0; --pom: #EF6C00; --tlo: #fff; --txt: #1b1b1b; --szary: #6b6b6b; --linia: #e3e3e3; --karta: #f5f5f7; }
@media (prefers-color-scheme: dark) { :root { --tlo: #111; --txt: #eee; --szary: #9a9a9a; --linia: #2c2c2c; --karta: #1c1c1e; } }
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--tlo); color: var(--txt);
  padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%; }
header { background: #D52B1E; color: #fff; padding: 10px 16px; font-weight: 700; font-size: 18px; display: flex; gap: 8px; align-items: center; }
header .krzyz { background: #fff; color: #D52B1E; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px; font-weight: 900; }
main { padding: 14px 16px; max-width: 640px; margin: 0 auto; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--karta); border-top: 1px solid var(--linia); padding-bottom: env(safe-area-inset-bottom); }
nav button { background: none; border: 0; padding: 8px 2px 10px; font-size: 12px; color: var(--szary); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav button span { font-size: 20px; }
nav button.akt { color: #D52B1E; font-weight: 700; }
h2 { font-size: 20px; margin: 6px 0; } h3 { margin: 0 0 8px; }
.c { text-align: center; } .duzy { font-size: 19px; } .maly { font-size: 13px; } .szary { color: var(--szary); }
.czer { color: var(--czer); } .ziel { color: var(--ziel); } .nieb { color: var(--nieb); } .pom { color: var(--pom); }
.licznik { font-size: 64px; font-weight: 800; margin: 4px 0; font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
.wielki { display: block; width: 100%; height: 72px; border: 0; border-radius: 14px; color: #fff; font-size: 22px; font-weight: 800; margin: 12px 0; letter-spacing: .5px; }
.wielki.ziel { background: var(--ziel); } .wielki.czer { background: var(--czer); } .wielki.nieb { background: var(--nieb); } .wielki.pom { background: var(--pom); }
.wielki:active, .szeroki:active, .maly-btn:active { filter: brightness(.9); }
.szeroki { display: block; width: 100%; padding: 14px; border-radius: 12px; border: 0; background: #D52B1E; color: #fff; font-weight: 700; margin: 12px 0; }
.obrys { background: none; color: inherit; border: 1.5px solid var(--linia); border-radius: 12px; padding: 12px; text-align: center; }
.szeroki.obrys { color: var(--txt); }
.maly-btn { border: 0; background: #D52B1E; color: #fff; border-radius: 10px; padding: 9px 14px; font-weight: 600; }
.tekst { background: none; border: 0; color: var(--nieb); padding: 10px; }
.chipy { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; justify-content: center; }
.chip { border: 1.5px solid var(--linia); background: none; color: inherit; border-radius: 20px; padding: 7px 14px; }
.chip.wyb { background: #D52B1E; border-color: #D52B1E; color: #fff; }
input, select { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1.5px solid var(--linia); border-radius: 10px; background: var(--tlo); color: var(--txt); margin: 4px 0 8px; }
label { display: block; font-size: 14px; color: var(--szary); }
label.chk { display: flex; gap: 10px; align-items: center; color: var(--txt); font-size: 15px; margin: 8px 0; }
label.chk input { width: 22px; height: 22px; margin: 0; }
.plik input { display: none; } .plik { color: var(--txt); font-size: 16px; }
.dwa { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wiersz { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.karta { background: var(--karta); border-radius: 12px; padding: 12px 14px; margin-top: 18px; }
.poz { padding: 10px 2px; border-bottom: 1px solid var(--linia); }
.linia { display: flex; justify-content: space-between; gap: 8px; padding: 3px 2px; } .linia span:first-child { flex: 1; } .linia.gruba { font-weight: 700; }
.tlo-czer { background: rgba(198, 40, 40, .12); border-radius: 6px; }
hr { border: 0; border-top: 1px solid var(--linia); margin: 14px 0; }
dialog { border: 0; border-radius: 16px; padding: 16px; width: min(560px, 94vw); max-height: 90vh; overflow: auto; background: var(--tlo); color: var(--txt); }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog.pelny { width: 100vw; height: 100vh; max-height: none; max-width: none; border-radius: 0; margin: 0; padding-top: calc(10px + env(safe-area-inset-top)); }
pre { font: 11px/1.35 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-word; }
@media print { body > *:not(dialog) { display: none !important; } dialog.pelny { position: static; display: block; } dialog .wiersz { display: none; } pre { font-size: 9pt; } }
</style>
</head>
<body>
<header><span class="krzyz">+</span>Godziny CH</header>
<main id="ekran"></main>
<nav id="nav"></nav>
<noscript>JavaScript</noscript>
<!--SKRYPTY--><script src="silnik.js"></script><script src="app.js"></script><!--/SKRYPTY-->
</body>
</html>
